name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Shell tests
        run: for t in tests/*.sh; do echo "== $t"; bash "$t"; done
      - name: Page script parses
        run: |
          sed -n '/<script>/,/<\/script>/p' docs/index.html | sed '1d;$d' > "$RUNNER_TEMP/page.js"
          node --check "$RUNNER_TEMP/page.js"
